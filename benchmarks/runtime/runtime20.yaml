# LabscriptAI runtime recovery benchmark.
# Frozen on 2026-05-21. Do not edit case definitions after freeze; append
# execution results elsewhere. If a case cannot be physically run on the
# available workstation, record not_run_hardware_unavailable instead of
# replacing the case.
schema_version: "0.1"
benchmark_id: runtime20
freeze_date: "2026-05-21"
status: frozen
scope: >
  Twenty runtime recovery cases for liquid-handling workstations. The set
  targets common recoverable or block-before-motion failures: consumables,
  deck/labware state, liquid state, module/gripper state, and human-controlled
  resume. Cases are platform-neutral by default and may be instantiated on
  Opentrons Flex/OT-2, Hamilton, Tecan, Beckman, or other liquid handlers when
  equivalent hardware signals exist.
claim_boundary: >
  These are runtime/error-recovery cases, not authoring tasks. They do not
  change the 90-task authoring benchmark or the 66-task external benchmark.
freeze_policy:
  case_definitions: locked_after_freeze
  allowed_after_freeze:
    - add execution_result records
    - add local evidence file paths
    - add video or trace artifact paths
    - mark hardware_unavailable or not_run
  forbidden_after_freeze:
    - change case_id
    - replace failure_mode
    - weaken expected_behavior
    - remove source provenance
scoring_fields:
  - detected
  - blocked_correctly
  - recovered_or_safely_escalated
  - robot_assisted
  - human_intervention_count
  - recovery_time_sec
  - evidence_complete
source_levels:
  official_vendor_behavior: >
    Backed by vendor documentation for liquid handling, labware movement,
    pipette sensors, module state, or run recovery.
  public_standard_or_backend_doc: >
    Backed by public automation abstractions such as PyLabRobot resources,
    Autoprotocol operations, or SiLA-style device state/recovery concepts.
  implemented_shadow_scenario: >
    Already implemented in LabscriptAI scenario_benchmark.py as an offline
    or read-only recovery scenario.
  local_physical_case: >
    Already observed in local physical Flex evidence.
  project_safety_stress: >
    Project-authored stress case designed from common liquid-handler hazards;
    do not claim it is an external public incident.
references:
  opentrons_flex_run_recovery: https://docs.opentrons.com/flex/touchscreen/protocol-run/
  opentrons_flex_introduction: https://docs.opentrons.com/flex/introduction/
  opentrons_flex_pipette_sensors: https://docs.opentrons.com/flex/system-description/pipettes/
  opentrons_liquid_control: https://docs.opentrons.com/python-api/building-block-commands/liquids/
  opentrons_moving_labware: https://docs.opentrons.com/v2/moving_labware.html
  opentrons_protocol_designer_move: https://docs.opentrons.com/protocol-designer/steps/move/
  opentrons_protocol_api: https://docs.opentrons.com/v2/new_protocol_api.html
  pylabrobot_resources: https://docs.pylabrobot.org/dev/api/pylabrobot.resources.html
  pylabrobot_standard_actions: https://docs.pylabrobot.org/api/_autosummary/pylabrobot.liquid_handling.standard.html
  autoprotocol_spec: https://autoprotocol.org/specification
  sila_error_recovery_context: https://sila-standard.com/sila_device/multidrop-driver-sila-2/
  local_physical_summary: /Users/gaoyuan/Documents/test/Flexagent/workspace-archive/opentrons-lab-exam/results/physical_runtime_bench_20260429/summary.csv
cases:
  - case_id: R001
    category: consumables
    failure_mode: missing_tip_at_planned_position
    source_level:
      - official_vendor_behavior
      - implemented_shadow_scenario
    source_refs:
      - opentrons_flex_run_recovery
      - opentrons_flex_pipette_sensors
      - src/labscriptai/runtime/scenario_benchmark.py:R001
    universal_applicability: high
    robot_required: tip_presence_or_pickup_feedback
    movement_allowed: no_motion_until_state_updated
    setup: Planned next tip is unavailable or pickup failed at the expected tip position.
    expected_behavior: >
      Mark the failed tip position unavailable, avoid retrying the same known-bad
      tip blindly, select a safe alternative tip if available, or pause for human
      refill/confirmation.
    pass_criteria:
      - detects missing or failed tip pickup
      - blocks ordinary transfer continuation with the missing tip
      - records unavailable tip position in runtime state
      - resumes only with a valid alternative tip or human confirmation

  - case_id: R002
    category: consumables
    failure_mode: insufficient_tips_for_remaining_plan
    source_level:
      - public_standard_or_backend_doc
      - project_safety_stress
    source_refs:
      - pylabrobot_resources
      - opentrons_flex_pipette_sensors
    universal_applicability: high
    robot_required: tip_inventory_or_tiprack_state
    movement_allowed: no_liquid_transfer_until_budget_resolved
    setup: Remaining work requires more clean tips than the loaded tip racks can provide.
    expected_behavior: >
      Detect tip budget infeasibility before exhausting tips during a live run,
      then request a refill, load an additional rack, or safely reduce/stop the
      remaining plan.
    pass_criteria:
      - computes remaining tip need
      - detects insufficient clean tips
      - does not silently reuse contaminated tips
      - pauses or switches to an operator-approved refill plan

  - case_id: R003
    category: consumables
    failure_mode: partial_tip_pickup_or_tip_drop_failure
    source_level:
      - official_vendor_behavior
      - project_safety_stress
    source_refs:
      - opentrons_flex_run_recovery
      - opentrons_flex_pipette_sensors
    universal_applicability: high
    robot_required: tip_presence_sensor_or_pickup_error
    movement_allowed: no_aspiration_until_tip_state_verified
    setup: A pipette reports partial pickup, failed pickup, or uncertain tip attachment.
    expected_behavior: >
      Treat uncertain tip attachment as unsafe for aspiration, drop or recover
      tips according to platform guidance, and request confirmation when the
      sensor cannot verify the tip state.
    pass_criteria:
      - detects uncertain tip state
      - blocks aspiration with uncertain or partial tips
      - chooses platform-safe drop/retry/escalation
      - records human intervention if sensor coverage is insufficient

  - case_id: R004
    category: consumables
    failure_mode: tip_or_liquid_waste_not_available
    source_level:
      - official_vendor_behavior
      - project_safety_stress
    source_refs:
      - opentrons_flex_run_recovery
      - autoprotocol_spec
    universal_applicability: high
    robot_required: waste_route_or_operator_observation
    movement_allowed: pause_before_drop_or_dispense_to_unsafe_waste
    setup: Tip trash, liquid waste, or a waste reservoir is missing, full, blocked, or not confirmed.
    expected_behavior: >
      Prevent blind disposal into an unsafe or unknown waste location. Pause for
      operator correction or choose a predeclared alternative waste route.
    pass_criteria:
      - checks declared waste route before use
      - blocks disposal to missing/full/unknown waste
      - preserves liquid/tip state when possible
      - resumes only after corrected waste state is confirmed

  - case_id: R005
    category: deck_labware
    failure_mode: destination_slot_or_well_occupied
    source_level:
      - official_vendor_behavior
      - implemented_shadow_scenario
      - local_physical_case
    source_refs:
      - opentrons_moving_labware
      - opentrons_protocol_designer_move
      - src/labscriptai/runtime/scenario_benchmark.py:R002
      - local_physical_summary:c3_occupied_gripper_safety_019
    universal_applicability: high
    robot_required: deck_state_or_operator_confirmation
    movement_allowed: no_motion_into_occupied_destination
    setup: Runtime observes that the planned destination position is occupied or may be occupied.
    expected_behavior: >
      Block movement or dispense into the occupied destination. Reconcile deck
      state, ask for human confirmation, or choose a preapproved alternative.
    pass_criteria:
      - detects occupied destination
      - blocks collision-prone move or dispense
      - records source of truth used for deck state
      - resumes only with confirmed safe destination

  - case_id: R006
    category: deck_labware
    failure_mode: wrong_labware_detected_before_run
    source_level:
      - official_vendor_behavior
      - implemented_shadow_scenario
      - local_physical_case
    source_refs:
      - opentrons_protocol_api
      - src/labscriptai/runtime/scenario_benchmark.py:R004
      - local_physical_summary:strict_unknown_labware_block_020
    universal_applicability: high
    robot_required: labware_identity_check_or_operator_confirmation
    movement_allowed: preflight_only_until_corrected
    setup: Observed labware does not match the protocol package at a required position.
    expected_behavior: >
      Fail preflight or pause before motion. Do not adapt offsets or transfer
      volumes for a different labware type unless a human approves a corrected
      protocol/package.
    pass_criteria:
      - detects labware mismatch
      - blocks run start or next motion
      - reports expected versus observed labware
      - requires correction or explicit human approval

  - case_id: R007
    category: deck_labware
    failure_mode: required_labware_missing_or_empty_slot
    source_level:
      - official_vendor_behavior
      - project_safety_stress
    source_refs:
      - opentrons_protocol_api
      - pylabrobot_resources
    universal_applicability: high
    robot_required: deck_state_or_preflight_check
    movement_allowed: preflight_only_until_present
    setup: A required source plate, destination plate, tip rack, or reservoir is absent from its expected position.
    expected_behavior: >
      Stop before any dependent motion and ask the operator to place or confirm
      the missing resource.
    pass_criteria:
      - identifies missing resource and position
      - blocks dependent pipetting or labware movement
      - keeps expected/observed deck state separate
      - resumes only after resource is observed or confirmed

  - case_id: R008
    category: deck_labware
    failure_mode: robot_state_and_vision_or_manual_state_disagree
    source_level:
      - local_physical_case
      - project_safety_stress
    source_refs:
      - local_physical_summary:c3_occupied_gripper_safety_019
      - local_physical_summary:gripper_c3_to_b3_021
    universal_applicability: medium
    robot_required: at_least_two_state_sources
    movement_allowed: no_motion_until_conflict_resolved
    setup: Two state sources disagree, such as robot API says unknown while human/vision says occupied, or vision misses a plate.
    expected_behavior: >
      Treat state disagreement as a blocker for motion into the disputed area.
      Prefer conservative human confirmation before continuing.
    pass_criteria:
      - detects state-source conflict
      - does not choose the optimistic source by default
      - records which source blocked motion
      - resumes only after conservative reconciliation

  - case_id: R009
    category: deck_labware
    failure_mode: labware_offset_or_position_not_verified
    source_level:
      - official_vendor_behavior
      - project_safety_stress
    source_refs:
      - opentrons_protocol_api
      - opentrons_moving_labware
    universal_applicability: high
    robot_required: position_or_calibration_metadata
    movement_allowed: no_low_clearance_motion_until_verified
    setup: Labware position, offset, adapter, carrier, or nest relationship is missing or not verified for the planned motion.
    expected_behavior: >
      Block low-clearance movements and pipetting that depend on unknown geometry
      until the labware position is verified or the operator accepts a safe
      fallback.
    pass_criteria:
      - detects missing geometry/offset confirmation
      - blocks low-clearance move or aspiration
      - reports which geometry field is missing
      - resumes only after verification or manual correction

  - case_id: R010
    category: liquid_state
    failure_mode: no_liquid_detected_before_aspiration
    source_level:
      - official_vendor_behavior
      - implemented_shadow_scenario
    source_refs:
      - opentrons_flex_run_recovery
      - opentrons_liquid_control
      - src/labscriptai/runtime/scenario_benchmark.py:R003
    universal_applicability: high
    robot_required: liquid_presence_sensor_or_operator_level_check
    movement_allowed: no_aspiration_until_liquid_confirmed
    setup: Source well/reservoir is expected to contain liquid but detection or observation says empty/unknown.
    expected_behavior: >
      Do not aspirate from an empty or unknown source. Probe, request refill, use
      a validated backup source, skip with explicit policy, or cancel safely.
    pass_criteria:
      - detects missing or unknown liquid
      - blocks aspiration from the unsafe source
      - preserves downstream treated-well state
      - resumes only with confirmed liquid or approved skip/cancel path

  - case_id: R011
    category: liquid_state
    failure_mode: insufficient_source_volume_or_dead_volume
    source_level:
      - public_standard_or_backend_doc
      - project_safety_stress
    source_refs:
      - autoprotocol_spec
      - opentrons_liquid_control
    universal_applicability: high
    robot_required: volume_model_or_operator_level_check
    movement_allowed: no_aspiration_below_safe_remaining_volume
    setup: Planned remaining transfers would draw source below usable/dead volume or below measured liquid height.
    expected_behavior: >
      Detect underfill before aspirating, update source volume state, and request
      refill, switch to a backup source, or reduce the remaining plan with human
      approval.
    pass_criteria:
      - computes requested volume plus dead-volume margin
      - detects infeasible source volume
      - prevents aspirating below safe volume
      - records refill/backup/stop decision

  - case_id: R012
    category: liquid_state
    failure_mode: overpressure_clog_or_bubble_during_pipetting
    source_level:
      - official_vendor_behavior
      - project_safety_stress
    source_refs:
      - opentrons_flex_run_recovery
      - opentrons_flex_pipette_sensors
    universal_applicability: high
    robot_required: pressure_feedback_or_operator_observation
    movement_allowed: pause_before_repeat_or_continue
    setup: Pipetting reports overpressure, clog, bubble, or abnormal liquid handling during aspiration/dispense.
    expected_behavior: >
      Pause, preserve sample state, avoid repeating the same failed motion
      blindly, and request an approved recovery such as changing tips, clearing
      the clog, refilling, or cancelling.
    pass_criteria:
      - detects abnormal pressure/bubble/clog state
      - blocks blind continuation
      - records whether liquid may remain in the tip
      - resumes only after safe recovery choice

  - case_id: R013
    category: liquid_state
    failure_mode: liquid_class_or_viscosity_mismatch
    source_level:
      - official_vendor_behavior
      - public_standard_or_backend_doc
      - project_safety_stress
    source_refs:
      - opentrons_flex_introduction
      - pylabrobot_standard_actions
    universal_applicability: high
    robot_required: liquid_class_metadata_or_operator_declaration
    movement_allowed: no_high_risk_transfer_until_parameters_checked
    setup: Liquid is viscous, volatile, foamy, or otherwise different from the default water-like assumption.
    expected_behavior: >
      Require suitable liquid-class or conservative pipetting parameters before
      physical execution. If unsupported, pause and ask for operator approval.
    pass_criteria:
      - detects missing or mismatched liquid handling assumptions
      - prevents default-speed high-risk transfer
      - records adjusted flow rate/mix/submerge policy or escalation
      - avoids claiming backend support without evidence

  - case_id: R014
    category: liquid_state
    failure_mode: cross_contamination_risk_after_failed_or_partial_transfer
    source_level:
      - public_standard_or_backend_doc
      - project_safety_stress
    source_refs:
      - autoprotocol_spec
      - pylabrobot_standard_actions
    universal_applicability: high
    robot_required: transfer_state_tracking
    movement_allowed: no_reuse_of_uncertain_or_contaminated_tip
    setup: A transfer fails after aspirating, partially dispensing, or touching a contamination-sensitive source/destination.
    expected_behavior: >
      Track which liquid may be in the tip and which wells may have been touched.
      Prevent unsafe tip reuse or duplicate dosing unless the operator approves a
      recovery plan.
    pass_criteria:
      - records aspirated/dispensed/uncertain liquid state
      - blocks contaminated tip reuse
      - protects untreated and treated wells from double dosing
      - escalates ambiguous partial-transfer state

  - case_id: R015
    category: module_state
    failure_mode: thermocycler_lid_closed_or_pipette_access_unsafe
    source_level:
      - official_vendor_behavior
      - project_safety_stress
    source_refs:
      - opentrons_moving_labware
      - opentrons_protocol_designer_move
      - opentrons_protocol_api
    universal_applicability: medium
    robot_required: thermocycler_or_lidded_module_state
    movement_allowed: no_pipetting_or_move_into_closed_lid_area
    setup: A protocol attempts to pipette into, or move labware to/from, a thermocycler or lidded module while access is unsafe.
    expected_behavior: >
      Check lid/access state first, open or request opening through supported
      commands, or pause for human intervention.
    pass_criteria:
      - detects lid/access blocker
      - blocks pipetting or move into unsafe area
      - waits for supported open/ready state or human confirmation
      - records module state before resume

  - case_id: R016
    category: module_state
    failure_mode: heater_shaker_latch_closed_or_shaking_state_unsafe
    source_level:
      - official_vendor_behavior
      - implemented_shadow_scenario
    source_refs:
      - opentrons_protocol_designer_move
      - opentrons_protocol_api
      - src/labscriptai/runtime/scenario_benchmark.py:R006
    universal_applicability: medium
    robot_required: heater_shaker_or_latched_module_state
    movement_allowed: no_labware_move_or_pipette_access_until_safe
    setup: Module latch is closed, module is shaking, or status is not safe for the next move/pipette action.
    expected_behavior: >
      Poll or pause until the module is safe. Do not move labware or pipette into
      a latched/shaking/unsafe module state.
    pass_criteria:
      - detects unsafe module state
      - blocks next dependent action
      - polls, pauses, or asks for human check
      - resumes only with safe state recorded

  - case_id: R017
    category: module_state
    failure_mode: module_not_ready_temperature_or_thermal_error
    source_level:
      - official_vendor_behavior
      - implemented_shadow_scenario
      - local_physical_case
    source_refs:
      - opentrons_protocol_api
      - src/labscriptai/runtime/scenario_benchmark.py:R006
      - runs/runtime-cases/2026-05-21-plan-check
    universal_applicability: medium
    robot_required: module_status_or_error_report
    movement_allowed: no_resume_until_module_error_resolved
    setup: A temperature-related module is busy, not at target, drifting, or reports a thermal/module error.
    expected_behavior: >
      Stop dependent workflow steps, collect module status/error details, and
      either wait, request human inspection, or abort according to severity.
    pass_criteria:
      - detects not-ready or error module status
      - blocks dependent protocol continuation
      - records module error/status payload
      - chooses wait/pause/abort instead of blind resume

  - case_id: R018
    category: module_state
    failure_mode: gripper_or_labware_move_preconditions_not_met
    source_level:
      - official_vendor_behavior
      - local_physical_case
      - project_safety_stress
    source_refs:
      - opentrons_moving_labware
      - opentrons_protocol_designer_move
      - local_physical_summary:gripper_c3_to_b3_021
    universal_applicability: medium
    robot_required: gripper_or_plate_mover
    movement_allowed: controlled_motion_only_after_preconditions_verified
    setup: A gripper or plate mover is asked to move labware while source, target, lid/latch, adapter, or occupancy preconditions are unverified.
    expected_behavior: >
      Verify all move preconditions before motion. Block the move if the target
      is occupied, module access is closed, labware is not gripper-compatible, or
      adapter state is unknown.
    pass_criteria:
      - checks source, destination, compatibility, and module access
      - blocks unsafe gripper/plate movement
      - records precondition failure
      - executes only after all preconditions are true

  - case_id: R019
    category: control_state
    failure_mode: interrupted_run_or_home_state_unknown
    source_level:
      - official_vendor_behavior
      - implemented_shadow_scenario
    source_refs:
      - opentrons_flex_run_recovery
      - src/labscriptai/runtime/scenario_benchmark.py:R005
    universal_applicability: high
    robot_required: run_status_or_position_state
    movement_allowed: no_resume_or_home_without_safety_check
    setup: A run is interrupted, paused, or recovering and the current gantry/head/deck safety state is unknown.
    expected_behavior: >
      Do not blindly resume or home. Inspect robot state, ask for human clearance
      when needed, and preserve run context before any motion.
    pass_criteria:
      - detects unknown post-interruption state
      - blocks blind resume/home
      - collects robot/run state before action
      - resumes only after safety clearance

  - case_id: R020
    category: control_state
    failure_mode: human_intervention_required_before_resume
    source_level:
      - official_vendor_behavior
      - public_standard_or_backend_doc
      - project_safety_stress
    source_refs:
      - opentrons_protocol_designer_move
      - opentrons_flex_run_recovery
      - sila_error_recovery_context
    universal_applicability: high
    robot_required: pause_resume_or_operator_confirmation_path
    movement_allowed: no_auto_resume_after_manual_step_without_confirmation
    setup: The workflow requires a human correction, manual move, refill, inspection, or safety confirmation before continuing.
    expected_behavior: >
      Keep the system paused until the operator explicitly confirms the manual
      step. Record what was confirmed and what remains uncertain.
    pass_criteria:
      - clearly requests the needed human action
      - does not auto-resume after an unconfirmed manual step
      - records confirmation details in trace
      - resumes only the safe remaining plan
