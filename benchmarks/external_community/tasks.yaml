      2. Prepare 48 colony PCR reactions in a PCR plate.
      3. Add PCR master mix first, then colony template suspension.
      4. Include positive and negative controls.
      5. Use fresh tips for template additions and document how colonies are pre-suspended off-deck.
      6. Keep polymerase cold and document thermocycler handoff.
  - id: EOPEN005
    source: openplant_automation_protocols
    upstream_id: OP_PY_005
    legacy_type: openplant_assembly_mix
    difficulty: Expert
    holdout: true
    output_contract: execution_package
    prompt: |
