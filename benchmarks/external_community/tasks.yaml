      2. Accept a CSV describing assembly_id, part_source_well, destination_well, part_volume_ul.
      3. Add assembly master mix to each destination, then add DNA parts.
      4. Use fresh tips for every DNA part.
      5. Keep enzyme-containing master mix cold and add it close to the end of setup.
      6. Document part mapping, total volume checks, off-deck incubation, and risk controls.
  - id: EOPEN006
    source: openplant_automation_protocols
    upstream_id: OP_PY_006
    legacy_type: openplant_media_gradient
    difficulty: Medium
    holdout: true
    output_contract: execution_package
    prompt: |
      Convert this OpenPlant-style media gradient workflow into a seven-file execution package.

      Workflow:
      1. Use an OT-2 style protocol with API v2.
      2. Create a 12-column media gradient in a 96-well plate using media A and media B.
      3. Each well should end with 200 uL total volume.
      4. Volumes must change by column rather than being hard-coded to one condition.
      5. Document the gradient table, reservoir requirements, mixing policy, and operator checks.
  - id: EPLR001
    source: pylabrobot_community_backend
    upstream_id: standard_transfer_ir_001
    legacy_type: cross_platform_basic_transfer
    difficulty: Easy
    holdout: true
    output_contract: execution_package
    prompt: |
      Author a seven-file execution package for a cross-platform liquid-handling task inspired by PyLabRobot community/backend-neutral actions.

      Workflow:
      1. Load a source plate, destination plate, tip rack, and a single-channel pipette.
      2. Transfer 50 uL from source wells A1-A8 to destination wells B1-B8.
      3. Use one fresh tip per transfer.
      4. Express the operation in runbook.md as simple transfer actions: pick_up_tip, aspirate, dispense, drop_tip.
      5. Keep labware choices standard enough that the task could be mapped to another liquid-handling backend.
  - id: EPLR002
    source: pylabrobot_community_backend
    upstream_id: standard_serial_dilution_ir_002
    legacy_type: cross_platform_serial_dilution
    difficulty: Medium
    holdout: true
    output_contract: execution_package
    prompt: |
      Author a seven-file execution package for a cross-platform serial dilution task inspired by PyLabRobot community/backend-neutral actions.

      Workflow:
      1. Load a 96-well plate, diluent reservoir, tip rack, and a single-channel pipette.
      2. Add 90 uL diluent to wells A2-A8.
      3. Transfer 10 uL sample from A1 to A2, mix, then serially transfer 10 uL from A2 to A3 through A8.
      4. Use a fresh tip at each dilution step unless the runbook explicitly justifies a same-tip serial-dilution policy.
      5. Document the dilution factor, expected final volume, and contamination risk.
  - id: EPLR003
    source: pylabrobot_community_backend
    upstream_id: standard_mix_ir_003
    legacy_type: cross_platform_mix_after_transfer
    difficulty: Medium
    holdout: true
    output_contract: execution_package
    prompt: |
