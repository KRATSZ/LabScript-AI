      Requirements:
      1. Use an OT-2 style protocol with API v2 and an 8-channel p300 pipette.
      2. Add 180 uL media from a reservoir to four 96-well destination plates.
      3. Process only columns 1-12 and document how partial plates are handled.
      4. Calculate reservoir volume with dead volume and warn when one reservoir channel is insufficient.
      5. Keep deck_plan.json consistent with every loaded plate and tip rack.
  - id: EOPL016
    source: opentrons_protocol_library
    upstream_id: Protocols-develop/protocols/96-well-hit-picking
    legacy_type: community_hit_picking
    difficulty: Hard
    holdout: true
    output_contract: execution_package
    prompt: |
      Convert this Opentrons Protocol Library style hit-picking workflow into a seven-file execution package.

      Requirements:
      1. Use an OT-2 style protocol with API v2.
      2. Accept a CSV listing hit wells from a source plate and destination wells in a confirmation plate.
      3. Transfer 20 uL from each hit to the destination.
      4. Use one fresh tip per hit.
      5. Include pre-run validation for duplicated destination wells and out-of-range well names.
      6. Document how the operator should review the generated hit map before starting.
  - id: EOPL017
    source: opentrons_protocol_library
    upstream_id: Protocols-develop/protocols/thermocycler-pcr
    legacy_type: community_thermocycler_pcr_program
    difficulty: Expert
    holdout: true
    output_contract: execution_package
    prompt: |
      Convert this Opentrons Protocol Library style thermocycler PCR workflow into a seven-file execution package.

      Requirements:
      1. Use an OT-2 or Flex style protocol with API v2 and a thermocycler module.
      2. Set up 24 PCR reactions and then run a PCR program.
      3. Do not pipette into the thermocycler while its block or lid is unsafe for liquid handling.
      4. Include lid temperature, initial denaturation, cycling, final extension, and hold steps.
      5. Document all module state changes and manual seal/unseal steps.
  - id: EOPL018
    source: opentrons_protocol_library
    upstream_id: Protocols-develop/protocols/plate-stamping
    legacy_type: community_plate_stamping
    difficulty: Medium
    holdout: true
    output_contract: execution_package
    prompt: |
      Convert this Opentrons Protocol Library style plate-stamping workflow into a seven-file execution package.

      Requirements:
      1. Use an OT-2 style protocol with API v2 and an 8-channel pipette.
      2. Copy 50 uL from one 96-well source plate to one 96-well destination plate by column.
      3. Support columns_to_copy from 1 to 12.
      4. Use fresh tips per column unless the runbook explicitly justifies a different policy.
      5. Document deck layout, column mapping, tip count, and source volume checks.
  - id: EOPEN001
    source: openplant_automation_protocols
    upstream_id: OP_PY_001
    legacy_type: openplant_glycerol_stocks
    difficulty: Medium
    holdout: true
    output_contract: execution_package
    prompt: |
      Convert this OpenPlant Automation Protocols workflow into a seven-file execution package.

      Source workflow: OP_PY_001, Glycerol stocks from 96-well cultures.

      Workflow:
      1. Use an OT-2 style protocol with API v2.
      2. Use an 8-channel p300 pipette on the right mount.
      3. Slot 1 contains a 96-deepwell plate with bacterial cultures, about 0.5 mL per well.
      4. Slot 4 contains a reservoir with 50% glycerol.
      5. Slot 7 contains a p300 tip rack.
      6. Slots 2, 3, 5, and 6 contain destination 96-well plates for glycerol stocks.
      7. Support a runtime parameter columns_to_process from 1 to 12.
      8. For each selected column, add glycerol and culture to destination wells using the 8-channel pipette, then mix gently.
      9. Document the column-count setting, deck setup, destination-plate mapping, and operator monitoring note in runbook.md.
  - id: EOPEN002
    source: openplant_automation_protocols
    upstream_id: OP_PY_002
    legacy_type: openplant_od_normalization
    difficulty: Hard
    holdout: true
    output_contract: execution_package
    prompt: |
