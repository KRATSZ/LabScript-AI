      2. Transfer 20 uL from source wells A1-H1 into one pool destination.
      3. Use one fresh tip per source well.
      4. Track final pool volume and tube capacity.
      5. Express pick_up_tip, aspirate, dispense, and drop_tip action order in runbook.md.
  - id: EPLR005
    source: pylabrobot_community_backend
    upstream_id: standard_reagent_distribution_ir_005
    legacy_type: cross_platform_reagent_distribution
    difficulty: Medium
    holdout: true
    output_contract: execution_package
    prompt: |
