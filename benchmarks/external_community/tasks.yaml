# External community authoring mini-benchmark manifest.
# This is a smoke-scale supplement to the main 90-task benchmark. It should not
# be merged into the main score because the source distribution is different.
schema_version: "0.4"
adapter_default: opentrons
required_package_files:
  - protocol.py
  - setup_card.html
  - manifest.json
tasks:
  - id: EOPL001
    source: opentrons_protocol_library
    source_level: public_protocol_entry_adapted
    upstream_id: Protocols-develop/protocols/85b0dc
    source_url: https://github.com/Opentrons/Protocols/tree/develop/protocols/85b0dc
    source_file_url: https://github.com/Opentrons/Protocols/blob/develop/protocols/85b0dc/pcr_prep.ot2.apiv2.py
    provenance: public_protocol_entry_adapted
    legacy_type: community_csv_pcr_cherrypick
    difficulty: Hard
    holdout: true
    output_contract: execution_package
    prompt: |
      Convert this Opentrons Protocol Library workflow into a three-piece v0.4 execution package.

      Source workflow: Sybr Green PCR prep with cherry-picking, based on Protocol Library entry 85b0dc.
      Public folder: https://github.com/Opentrons/Protocols/tree/develop/protocols/85b0dc
      Public file: https://github.com/Opentrons/Protocols/blob/develop/protocols/85b0dc/pcr_prep.ot2.apiv2.py

      Requirements:
      1. Use an OT-2 style protocol with API v2.
      2. Use a P20 single-channel pipette and 20 uL tips.
      3. Support a CSV mapping with columns: source well, mastermix tube, destination well.
      4. For each row, transfer user-specified master mix volume from a 1.5 mL tube rack to the PCR destination plate.
      5. Then transfer user-specified DNA sample volume from the source aluminum block to the same destination well.
      6. Use fresh tips for DNA/template transfers and avoid returning a template-contaminated tip to any master-mix source.
      7. Document the CSV format, deck layout, tip policy, and manual pre-run checks in the package.
