      Workflow:
      1. Use an OT-2 style protocol with API v2.
      2. Add 2 uL inducer from a tube rack to selected wells in a 96-well culture plate.
      3. Support an inducer_map CSV with inducer_name, source_tube, destination_well.
      4. Use fresh tips between different inducers.
      5. Document manual sealing, shaking/incubation handoff, and inducer cross-contamination risk.
  - id: EOPEN004
    source: openplant_automation_protocols
    upstream_id: OP_PY_004
    legacy_type: openplant_colony_pcr_setup
    difficulty: Hard
    holdout: true
    output_contract: execution_package
