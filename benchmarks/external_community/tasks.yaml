      Workflow:
      1. Use an OT-2 style protocol with API v2.
      2. Accept a CSV with culture_well, destination_well, culture_volume_ul, diluent_volume_ul.
      3. Add diluent first, then culture, into a destination 96-well plate.
      4. Split transfers above pipette capacity.
      5. Use fresh tips for each culture.
      6. Document CSV review, reservoir volume, sterility checks, and biological replicate mapping.
  - id: EOPEN003
    source: openplant_automation_protocols
    upstream_id: OP_PY_003
    legacy_type: openplant_induction_plate
    difficulty: Medium
    holdout: true
    output_contract: execution_package
