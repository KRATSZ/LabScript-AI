      2. Prepare 32 enzyme-digest reactions with buffer, DNA, enzyme, and nuclease-free water.
      3. Keep enzyme cold and add it last.
      4. Calculate reagent totals with dead volume and document maximum room-temperature exposure.
      5. Use fresh tips for enzyme and DNA transfers.
      6. Add an off-deck incubation pause instead of unsupported automation.
  - id: EOPL014
    source: opentrons_protocol_library
    upstream_id: Protocols-develop/protocols/antibody-plate-wash
    legacy_type: community_elisa_wash
    difficulty: Medium
    holdout: true
    output_contract: execution_package
    prompt: |
