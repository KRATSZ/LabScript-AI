# External community authoring mini-benchmark manifest.
# This is a smoke-scale supplement to the main 90-task benchmark. It should not
# be merged into the main score because the source distribution is different.
schema_version: "0.1"
adapter_default: opentrons
required_package_files:
  - protocol.py
  - deck_plan.json
  - reagent_plan.json
  - tip_plan.json
  - runbook.md
  - risk_checklist.json
  - manifest.json
tasks:
  - id: EOPL001
    source: opentrons_protocol_library
    upstream_id: Protocols-develop/protocols/85b0dc
    legacy_type: community_csv_pcr_cherrypick
    difficulty: Hard
    holdout: true
    output_contract: execution_package
    prompt: |
      Convert this Opentrons Protocol Library workflow into a seven-file execution package.

      Source workflow: Sybr Green PCR prep with cherry-picking, based on Protocol Library entry 85b0dc.

      Requirements:
      1. Use an OT-2 style protocol with API v2.
      2. Use a P20 single-channel pipette and 20 uL tips.
      3. Support a CSV mapping with columns: source well, mastermix tube, destination well.
      4. For each row, transfer user-specified master mix volume from a 1.5 mL tube rack to the PCR destination plate.
      5. Then transfer user-specified DNA sample volume from the source aluminum block to the same destination well.
      6. Use fresh tips for DNA/template transfers and avoid returning a template-contaminated tip to any master-mix source.
      7. Document the CSV format, deck layout, tip policy, and manual pre-run checks in the package.
  - id: EOPL002
    source: opentrons_protocol_library
    upstream_id: Protocols-develop/protocols/797dee-normalization
    legacy_type: community_csv_normalization
    difficulty: Hard
    holdout: true
    output_contract: execution_package
    prompt: |
      Convert this Opentrons Protocol Library workflow into a seven-file execution package.

      Source workflow: concentration normalization with a 50 mL diluent tube, based on Protocol Library entry 797dee-normalization.

      Requirements:
      1. Use an OT-2 style protocol with API v2.
      2. Accept a CSV-like 96-well table where each value is the diluent volume in uL for the matching destination well; zero means skip that well.
      3. Load one source plate, one destination plate, one 50 mL tube rack containing diluent, one compatible single-channel pipette, and enough tips.
      4. Transfer the requested diluent volume into each non-zero destination well.
      5. Split transfers that exceed pipette capacity.
      6. Track the starting diluent volume and flag when requested total volume plus dead volume is infeasible.
      7. Document portrait-vs-landscape CSV orientation assumptions in runbook.md and risk_checklist.json.
  - id: EOPL003
    source: opentrons_protocol_library
    upstream_id: Protocols-develop/protocols/0845ab
    legacy_type: community_magnetic_cleanup_digest
    difficulty: Expert
    holdout: true
    output_contract: execution_package
    prompt: |
      Convert this Opentrons Protocol Library workflow into a seven-file execution package.

      Source workflow: digestion and bead cleanup, based on Protocol Library entry 0845ab.

      Requirements:
      1. Support 16, 32, or 48 samples.
      2. Use a magnetic module for bead cleanup and clearly separate magnet-engaged aspiration from magnet-disengaged resuspension.
      3. Add bead solution, sample, acetonitrile, ethanol washes, digestion solution, TEAB, TMT/buffer mix, hydroxylamine, and formic acid in the correct phases.
      4. Include pauses for off-deck heater-shaker incubation and overnight digestion instead of pretending the OT-2 can automate those steps.
      5. Use fresh tips for sample and labeling transfers where cross-contamination matters.
      6. Document module state, handoff pauses, reagent locations, and high-risk manual checks.
  - id: EOPL004
    source: opentrons_protocol_library
    upstream_id: Protocols-develop/protocols/pcr-mastermix-distribution
    legacy_type: community_pcr_mastermix_multichannel
    difficulty: Medium
    holdout: true
    output_contract: execution_package
    prompt: |
      Convert this Opentrons Protocol Library style PCR master-mix distribution workflow into a seven-file execution package.

      Requirements:
      1. Use an OT-2 style protocol with API v2.
      2. Load a 96-well PCR plate, a 12-channel reservoir, one p20 or p300 multi-channel pipette, and enough tips.
      3. Support columns_to_fill from 1 to 12.
      4. Dispense 18 uL PCR master mix into each selected column.
      5. Keep master mix cold in the runbook and require the operator to pre-chill the plate if available.
      6. Calculate total master-mix volume with at least 10% overage and document dead-volume assumptions.
      7. Use fresh tips when contamination risk changes and record the policy in tip_plan.json.
  - id: EOPL005
    source: opentrons_protocol_library
    upstream_id: Protocols-develop/protocols/serial-dilution-96
    legacy_type: community_serial_dilution_plate
    difficulty: Medium
    holdout: true
    output_contract: execution_package
    prompt: |
      Convert this Opentrons Protocol Library style serial dilution workflow into a seven-file execution package.

      Requirements:
      1. Use an OT-2 style protocol with API v2.
      2. Load a 96-well plate, a reservoir with diluent, a p300 single-channel pipette, and one 300 uL tip rack.
      3. Add 90 uL diluent to wells A2-A12.
      4. Transfer 10 uL sample from A1 to A2, mix, then serially transfer 10 uL through A12.
      5. Use a fresh tip for each dilution transfer unless the package clearly justifies same-tip serial dilution.
      6. Document the dilution factor, final volume, and cross-contamination risk.
  - id: EOPL006
    source: opentrons_protocol_library
    upstream_id: Protocols-develop/protocols/cherry-pick-plate-copy
    legacy_type: community_cherrypick_plate_copy
    difficulty: Hard
    holdout: true
    output_contract: execution_package
    prompt: |
      Convert this Opentrons Protocol Library style cherry-pick plate-copy workflow into a seven-file execution package.

      Requirements:
      1. Use an OT-2 style protocol with API v2.
      2. Accept a CSV mapping with columns source_plate, source_well, destination_plate, destination_well, volume_ul.
      3. Load two source plates and two destination plates.
      4. Split transfers above pipette capacity and skip rows with zero volume.
      5. Use fresh tips for every source well to avoid cross-contamination.
      6. Include CSV validation instructions and a runbook section for failed row handling.
  - id: EOPL007
    source: opentrons_protocol_library
    upstream_id: Protocols-develop/protocols/magnetic-bead-cleanup-96
    legacy_type: community_magnetic_bead_cleanup
    difficulty: Expert
    holdout: true
    output_contract: execution_package
    prompt: |
      Convert this Opentrons Protocol Library style magnetic bead cleanup workflow into a seven-file execution package.

      Requirements:
      1. Use an OT-2 style protocol with API v2 and a magnetic module.
      2. Support sample_count of 24, 48, or 96.
      3. Add beads, mix thoroughly, pause for binding, engage magnet, remove supernatant, perform two ethanol washes, air-dry, disengage magnet, and elute.
      4. Never add elution buffer while the magnet remains engaged.
      5. Document magnet states, drying limits, ethanol carryover risk, and operator pauses.
      6. Use fresh tips for sample/bead handling and avoid disturbing beads during supernatant removal.
  - id: EOPL008
    source: opentrons_protocol_library
    upstream_id: Protocols-develop/protocols/qpcr-setup-triplicates
    legacy_type: community_qpcr_triplicate_setup
    difficulty: Hard
    holdout: true
    output_contract: execution_package
    prompt: |
      Convert this Opentrons Protocol Library style qPCR setup workflow into a seven-file execution package.

      Requirements:
      1. Use an OT-2 style protocol with API v2.
      2. Support 16 samples, each plated in technical triplicate.
      3. Add qPCR master mix and then template into a 96-well qPCR plate.
      4. Include no-template controls and positive controls.
      5. Use fresh tips for template transfers and keep master mix/template contamination separated.
      6. Document replicate mapping, control wells, cold-chain assumptions, and total reagent volume.
  - id: EOPL009
    source: opentrons_protocol_library
    upstream_id: Protocols-develop/protocols/normalization-with-water
    legacy_type: community_normalization_variable_water
    difficulty: Hard
    holdout: true
    output_contract: execution_package
    prompt: |
      Convert this Opentrons Protocol Library style normalization workflow into a seven-file execution package.

      Requirements:
      1. Use an OT-2 style protocol with API v2.
      2. Accept a CSV with sample_well, destination_well, sample_volume_ul, water_volume_ul.
      3. Transfer water first, then sample, into a destination plate.
      4. Skip invalid rows and document how the operator should correct the CSV.
      5. Split large water transfers across multiple aspirations if needed.
      6. Track water reservoir total volume plus dead volume.
  - id: EOPL010
    source: opentrons_protocol_library
    upstream_id: Protocols-develop/protocols/illumina-library-pooling
    legacy_type: community_library_pooling
    difficulty: Expert
    holdout: true
    output_contract: execution_package
    prompt: |
      Convert this Opentrons Protocol Library style library pooling workflow into a seven-file execution package.

      Requirements:
      1. Use an OT-2 style protocol with API v2.
      2. Accept a CSV with source_well and pool_volume_ul for up to 96 indexed libraries.
      3. Transfer each library into one pool tube.
      4. Use fresh tips for every library and document barcode cross-contamination risk.
      5. Split transfers if the requested volume exceeds pipette capacity.
      6. Track total pool volume and require the operator to confirm tube capacity before run start.
  - id: EOPL011
    source: opentrons_protocol_library
    upstream_id: Protocols-develop/protocols/plate-reformat-384-to-96
    legacy_type: community_plate_reformat_384_to_96
    difficulty: Expert
    holdout: true
    output_contract: execution_package
    prompt: |
      Convert this Opentrons Protocol Library style 384-to-96 plate reformat workflow into a seven-file execution package.

      Requirements:
      1. Use an OT-2 style protocol with API v2.
      2. Load one 384-well source plate and four 96-well destination plates.
      3. Map quadrants from the 384-well plate into the four 96-well plates.
      4. Transfer 5 uL per well using a low-volume pipette.
      5. Use fresh tips for each source well and document tip count feasibility.
      6. Include a clear mapping explanation in runbook.md.
  - id: EOPL012
    source: opentrons_protocol_library
    upstream_id: Protocols-develop/protocols/bacterial-transformation-setup
    legacy_type: community_transformation_setup
    difficulty: Hard
    holdout: true
    output_contract: execution_package
    prompt: |
      Convert this Opentrons Protocol Library style transformation setup workflow into a seven-file execution package.

      Requirements:
      1. Use an OT-2 style protocol with API v2.
      2. Combine competent cells and plasmid DNA in chilled wells for 24 reactions.
      3. Insert manual pauses for ice incubation, heat shock, recovery medium addition, and off-deck incubation.
      4. Never pretend the robot performs heat shock unless a supported module and safe method are specified.
      5. Use fresh tips for DNA transfer and document biosafety/manual handling notes.
  - id: EOPL013
    source: opentrons_protocol_library
    upstream_id: Protocols-develop/protocols/enzyme-digest-reaction-setup
    legacy_type: community_enzyme_digest_setup
    difficulty: Hard
    holdout: true
    output_contract: execution_package
