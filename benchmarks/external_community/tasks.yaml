    prompt: |
      Author a seven-file execution package for a backend-neutral pooling workflow.

      Workflow:
      1. Load a 96-well source plate, a destination tube rack or deep-well plate, tip rack, and a single-channel pipette.
      2. Transfer 15 uL from wells A1-H3 into one pool destination.
      3. Use a fresh tip for each source well.
      4. Track final pool volume and require the operator to confirm destination capacity.
