      Workflow:
      1. Load a reservoir, destination plate, tip rack, and a single-channel pipette.
      2. Transfer 100 uL buffer from reservoir A1 to plate wells A1-A6.
      3. Mix each destination well 5 times with 50 uL after dispensing.
      4. Express the core operations as transfer and mix actions in runbook.md.
      5. Document why these operations are backend-neutral.
  - id: EPLR004
    source: pylabrobot_community_backend
    upstream_id: standard_pooling_ir_004
    legacy_type: cross_platform_pooling
    difficulty: Hard
    holdout: true
    output_contract: execution_package
    prompt: |
