  - id: EPLR009
    source: pylabrobot_community_backend
    upstream_id: pylabrobot_docs_normalization_actions
    legacy_type: pylabrobot_backend_variable_volume_normalization
    difficulty: Hard
    holdout: true
    output_contract: execution_package
    prompt: |
