      Requirements:
      1. Use an OT-2 style protocol with API v2.
      2. Wash a 96-well plate three times with 250 uL wash buffer per well.
      3. Aspirate waste without scraping the well bottom.
      4. Track total wash buffer and total liquid sent to waste or trash.
      5. Include operator checks for residual liquid, splash risk, and waste capacity.
  - id: EOPL015
    source: opentrons_protocol_library
    upstream_id: Protocols-develop/protocols/media-addition-multiplate
    legacy_type: community_media_addition_multiplate
    difficulty: Medium
    holdout: true
    output_contract: execution_package
    prompt: |
