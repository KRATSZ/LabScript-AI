      4. Document total reagent requirement and action-level transfer sequence.
  - id: EPLR006
    source: pylabrobot_community_backend
    upstream_id: standard_pause_ir_006
    legacy_type: cross_platform_pause_and_confirm
    difficulty: Hard
    holdout: true
    output_contract: execution_package
    prompt: |
      Author a seven-file execution package for a cross-platform workflow with an operator confirmation step that should compile to LabFlow IR and PyLabRobot backend-neutral actions where supported.

      Workflow:
      1. Load a source plate, destination plate, tip rack, and a single-channel pipette.
      2. Transfer 30 uL from source wells B1-B6 to destination wells C1-C6.
      3. Pause after the first three transfers and ask the operator to confirm there are no bubbles.
      4. Resume the remaining three transfers after confirmation.
      5. Document which parts are standard liquid-handling actions and which part is an operator pause.
  - id: EPLR007
    source: pylabrobot_community_backend
