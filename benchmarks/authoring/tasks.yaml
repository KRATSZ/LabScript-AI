    commit: 0ef14a3a83254a7bd0eb908e28810ee8583f7fdc
    license: MIT
    used_in: T001-T027
    note: T028-T055 are project-expanded legacy tasks that preserve the same upstream lineage but are not a 1:1 count of the original upstream question set
