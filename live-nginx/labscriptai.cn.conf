server {
    listen 80 ; 
    listen 443 ssl ; 
    server_name labscriptai.cn; 
    index index.html; 
    access_log /www/sites/labscriptai.cn/log/access.log main; 
    error_log /www/sites/labscriptai.cn/log/error.log; 
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md) {
        return 404; 
    }
    location ^~ /.well-known/acme-challenge {
        allow all; 
        root /usr/share/nginx/html; 
    }
    root /www/sites/labscriptai.cn/index/dist; 
    location / {
        try_files $uri $uri/ /index.html; 
    }
    error_page 404 /index.html; 
    http2 on; 
    if ($scheme = http) {
        return 301 https://$host$request_uri; 
    }
    ssl_certificate /www/sites/labscriptai.cn/ssl/fullchain.pem; 
    ssl_certificate_key /www/sites/labscriptai.cn/ssl/privkey.pem; 
    ssl_protocols TLSv1.3 TLSv1.2; 
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA256:!aNULL:!eNULL:!EXPORT:!DSS:!DES:!RC4:!3DES:!MD5:!PSK:!KRB5:!SRP:!CAMELLIA:!SEED; 
    ssl_prefer_server_ciphers off; 
    ssl_session_cache shared:SSL:10m; 
    ssl_session_timeout 10m; 
    error_page 497 https://$host$request_uri; 
    proxy_set_header X-Forwarded-Proto https; 
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains"; 
    add_header Access-Control-Allow-Origin * always; 
    add_header Access-Control-Allow-Methods GET,POST,OPTIONS,PUT,DELETE always; 
    add_header Access-Control-Allow-Credentials true always; 
    if ( $request_method = 'OPTIONS' ) {
        return 204; 
    }
}