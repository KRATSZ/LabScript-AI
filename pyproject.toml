[project]
name = "opentrons-lab-agent"
version = "0.1.0"
description = "LabscriptAI: Opentrons protocol authoring agent, MCP runtime, benchmarks, and operator workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "SmartisanNaive" }
]
keywords = ["opentrons", "labscriptai", "agent", "lab-automation", "ot-2", "flex", "mcp"]
dependencies = [
  "textual>=0.85,<1.0",
]

[project.optional-dependencies]
# Robot API + protocol helpers (pins numpy 1.x stack; pair with `vision` only if versions resolve).
protocol = [
  "opentrons==8.8.1",
]
vision = [
  "ultralytics>=8.4.0",
  "opencv-python-headless>=4.6.0",
  "clip @ git+https://github.com/ultralytics/CLIP.git",
]
rag = [
  "chromadb>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/SmartisanNaive/Opentrons-Lab-Agent"
Repository = "https://github.com/SmartisanNaive/Opentrons-Lab-Agent"

[tool.pytest.ini_options]
pythonpath = ["src"]
