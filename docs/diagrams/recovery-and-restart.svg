<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">
  <title>Runtime recovery vs restart</title>
  <defs>
    <filter id="rsh" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1e3a5f" flood-opacity="0.09"/>
    </filter>
  </defs>
  <rect width="760" height="400" fill="#ffffff"/>
  <text x="380" y="26" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">🔀 Two common paths</text>
  <text x="380" y="44" text-anchor="middle" font-size="10" fill="#94a3b8">🔵 Blue = restart / reconcile · ⬛ Slate = live recovery</text>

  <rect x="40" y="58" width="320" height="292" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.75" filter="url(#rsh)"/>
  <text x="200" y="80" text-anchor="middle" font-size="14">⚡</text>
  <text x="200" y="96" text-anchor="middle" font-weight="700" fill="#334155">A: During a run (protocol / hardware)</text>
  <text x="200" y="112" text-anchor="middle" font-size="10" fill="#64748b">MCP recovery chain</text>

  <rect x="60" y="118" width="280" height="36" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/>
  <text x="200" y="134" text-anchor="middle" font-size="11">📜</text>
  <text x="200" y="148" text-anchor="middle" font-size="11" fill="#475569">run_history → parse_error</text>

  <line x1="200" y1="154" x2="200" y2="172" stroke="#cbd5e1" stroke-width="2"/>

  <rect x="60" y="176" width="280" height="36" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/>
  <text x="200" y="192" text-anchor="middle" font-size="11">💡</text>
  <text x="200" y="206" text-anchor="middle" font-size="11" fill="#475569">suggest_recovery_action</text>

  <line x1="200" y1="212" x2="200" y2="230" stroke="#cbd5e1" stroke-width="2"/>

  <rect x="60" y="234" width="280" height="52" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.25"/>
  <text x="200" y="250" text-anchor="middle" font-size="11">🛠️</text>
  <text x="200" y="266" text-anchor="middle" font-size="11" fill="#334155">execute_protocol_recovery / recover_tip_pickup</text>
  <text x="200" y="280" text-anchor="middle" font-size="9" fill="#64748b">Hard stops: human review (CLAUDE.md)</text>

  <rect x="400" y="58" width="320" height="292" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.75" filter="url(#rsh)"/>
  <text x="560" y="80" text-anchor="middle" font-size="14">🔄</text>
  <text x="560" y="96" text-anchor="middle" font-weight="700" fill="#1e40af">B: After MCP / host restart</text>
  <text x="560" y="112" text-anchor="middle" font-size="10" fill="#475569">Logs are history; reconcile session state</text>

  <rect x="420" y="118" width="280" height="44" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.25"/>
  <text x="560" y="134" text-anchor="middle" font-size="11">🧭</text>
  <text x="560" y="148" text-anchor="middle" font-size="11" fill="#1e40af">safe_next_action or restart_review</text>
  <text x="560" y="162" text-anchor="middle" font-size="9" fill="#64748b">optional robot_ip for home preview</text>

  <line x1="560" y1="162" x2="560" y2="180" stroke="#93c5fd" stroke-width="2"/>

  <rect x="420" y="184" width="280" height="40" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.25"/>
  <text x="560" y="200" text-anchor="middle" font-size="11">🔗</text>
  <text x="560" y="214" text-anchor="middle" font-size="11" fill="#1e40af">If reconcile_first: reconcile_state</text>

  <line x1="560" y1="224" x2="560" y2="242" stroke="#93c5fd" stroke-width="2"/>

  <rect x="420" y="246" width="280" height="52" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.25"/>
  <text x="560" y="262" text-anchor="middle" font-size="11">📡</text>
  <text x="560" y="278" text-anchor="middle" font-size="11" fill="#1e40af">robot_status, module_status</text>
  <text x="560" y="292" text-anchor="middle" font-size="10" fill="#475569">is_home_safe before home</text>

  <text x="380" y="378" text-anchor="middle" font-size="10" fill="#64748b">🗃️ experiment_history: audit only — not current deck truth</text>
</svg>
