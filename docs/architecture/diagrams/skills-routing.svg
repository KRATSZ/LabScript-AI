<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">
  <title>Skills routing</title>
  <defs>
    <filter id="s" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#1e3a5f" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="720" height="480" fill="#ffffff"/>
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">🧭 Skills — default vs on-demand</text>
  <text x="360" y="46" text-anchor="middle" font-size="11" fill="#64748b">📋 CLAUDE.md on-demand routing</text>
  <ellipse cx="360" cy="130" rx="118" ry="46" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#s)"/>
  <text x="360" y="118" text-anchor="middle" font-size="14">🎯</text>
  <text x="360" y="134" text-anchor="middle" font-weight="700" fill="#1e3a8a">opentrons-experiment-run</text>
  <text x="360" y="150" text-anchor="middle" font-size="10" fill="#475569">Default entry</text>
  <rect x="80" y="240" width="160" height="56" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5" filter="url(#s)"/>
  <text x="160" y="262" text-anchor="middle" font-size="11">📝</text>
  <text x="160" y="278" text-anchor="middle" font-weight="600" fill="#1e293b">protocol-author</text>
  <rect x="280" y="240" width="160" height="56" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5" filter="url(#s)"/>
  <text x="360" y="262" text-anchor="middle" font-size="11">✅</text>
  <text x="360" y="278" text-anchor="middle" font-weight="600" fill="#1e293b">protocol-verify</text>
  <rect x="480" y="240" width="160" height="56" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5" filter="url(#s)"/>
  <text x="560" y="262" text-anchor="middle" font-size="11">🔧</text>
  <text x="560" y="278" text-anchor="middle" font-weight="600" fill="#334155">simulation-repair</text>
  <rect x="180" y="330" width="160" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" filter="url(#s)"/>
  <text x="260" y="348" text-anchor="middle" font-size="11">🗺️</text>
  <text x="260" y="364" text-anchor="middle" font-size="10" fill="#475569">intent-review</text>
  <rect x="380" y="330" width="160" height="56" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#s)"/>
  <text x="460" y="342" text-anchor="middle" font-size="11">📚</text>
  <text x="460" y="358" text-anchor="middle" font-size="10" fill="#64748b">protocol-library</text>
  <text x="460" y="372" text-anchor="middle" font-size="8" fill="#94a3b8">on-demand</text>
  <rect x="80" y="400" width="140" height="44" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="150" y="416" text-anchor="middle" font-size="11">🌐</text>
  <text x="150" y="432" text-anchor="middle" font-size="10" fill="#64748b">robot-lan</text>
  <rect x="500" y="400" width="140" height="44" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="570" y="416" text-anchor="middle" font-size="11">📷</text>
  <text x="570" y="432" text-anchor="middle" font-size="10" fill="#64748b">vision</text>
  <line x1="300" y1="162" x2="200" y2="232" stroke="#94a3b8" stroke-width="1.25"/>
  <line x1="360" y1="176" x2="360" y2="240" stroke="#94a3b8" stroke-width="1.25"/>
  <line x1="420" y1="162" x2="520" y2="232" stroke="#94a3b8" stroke-width="1.25"/>
  <line x1="340" y1="168" x2="280" y2="318" stroke="#94a3b8" stroke-width="1.25"/>
  <line x1="400" y1="168" x2="440" y2="318" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 3"/>
