<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">
  <defs>
    <linearGradient id="g-plugin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#eff6ff"/>
      <stop offset="100%" style="stop-color:#dbeafe"/>
    </linearGradient>
    <linearGradient id="g-skills" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#f1f5f9"/>
    </linearGradient>
    <linearGradient id="g-mcp" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e0e7ff"/>
      <stop offset="100%" style="stop-color:#c7d2fe"/>
    </linearGradient>
    <linearGradient id="g-state" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f1f5f9"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1e3a5f" flood-opacity="0.1"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="720" height="520" fill="#ffffff"/>
  <title>Opentrons-Lab-Agent five layers</title>
  <text x="360" y="28" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">🏗️ Opentrons-Lab-Agent: five layers</text>
  <text x="360" y="48" text-anchor="middle" font-size="11" fill="#64748b">Truth: MCP + persisted state. Skills orchestrate; they do not own deck truth.</text>

  <rect x="80" y="70" width="560" height="52" rx="8" fill="url(#g-plugin)" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="100" y="92" font-weight="600" fill="#1e40af">📦 1. Plugin</text>
  <text x="100" y="110" font-size="11" fill="#475569">.claude-plugin / .mcp.json / CLAUDE.md — distribution</text>

  <rect x="80" y="132" width="560" height="62" rx="8" fill="url(#g-skills)" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="100" y="154" font-weight="600" fill="#334155">🧩 2. Skills</text>
  <text x="100" y="172" font-size="11" fill="#475569">experiment-run, protocol-author, protocol-verify, ...</text>
  <text x="100" y="186" font-size="10" fill="#64748b">Compact workflows; no authoritative runtime state</text>

  <rect x="80" y="204" width="560" height="72" rx="8" fill="url(#g-mcp)" stroke="#4f46e5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="100" y="226" font-weight="600" fill="#3730a3">⚙️ 3. MCP (opentrons-lab-mcp)</text>
  <text x="100" y="244" font-size="11" fill="#475569">simulate_protocol, run_protocol, reconcile_state, parse_error, ...</text>
  <text x="100" y="260" font-size="10" fill="#64748b">Simulation gate, live commands, recovery, optional camera</text>

  <rect x="80" y="286" width="560" height="62" rx="8" fill="url(#g-state)" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="100" y="308" font-weight="600" fill="#1e293b">💾 4. Persisted state</text>
  <text x="100" y="326" font-size="11" fill="#475569">data/session-state/ — slots, tips, reconciliation, cleanup</text>
  <text x="100" y="340" font-size="10" fill="#64748b">Authoritative deck semantics vs prompt-only reasoning</text>

  <rect x="80" y="358" width="560" height="52" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 5" filter="url(#shadow)"/>
  <text x="100" y="380" font-weight="600" fill="#475569">👁️ 5. Optional perception</text>
  <text x="100" y="398" font-size="11" fill="#64748b">Camera / vision_check — not baseline; reconcile with reconcile_state</text>

  <path d="M360 122 L360 132" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M360 194 L360 204" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M360 276 L360 286" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M360 348 L360 358" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <text x="360" y="455" text-anchor="middle" font-size="11" fill="#64748b">🤖 Physical robot — HTTP/LAN — MCP tools (sim + live gated)</text>
</svg>