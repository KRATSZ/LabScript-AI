<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <title>LabscriptAI</title>
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body { font-family: "Public Sans", ui-sans-serif, system-ui, -apple-system, sans-serif; background: #f4f5f7; color: #16212d; }
      .boot { padding: 24px; color: #6b7280; font-size: 14px; }
    </style>
  </head>
  <body>
    <div id="root"><p class="boot">Opening…</p></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener("error", function (ev) {
        var el = document.getElementById("root");
        if (el && el.querySelector(".boot")) {
          el.innerHTML = "<p class=\"boot\">Page script error: " + String(ev.message || "unknown") + "</p>";
        }
      });
    </script>
  </body>
</html>
