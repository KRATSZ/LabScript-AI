<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>LabscriptAI watch-stage smoke</title>
    <style>
      html, body, #root { height: 100%; height: 100dvh; margin: 0; }
      body { font-family: ui-sans-serif, system-ui, sans-serif; background: #f9fafb; }
      .boot { padding: 24px; color: #6b7280; font-size: 14px; }
    </style>
  </head>
  <body>
    <div id="root"><p class="boot">Opening watch-stage smoke…</p></div>
    <script type="module" src="/src/watchStageSmoke.tsx"></script>
    <script>
      window.addEventListener("error", function (ev) {
        var el = document.getElementById("root");
        if (el && el.querySelector(".boot")) {
          el.innerHTML = "<p class=\"boot\">Page script error: " + String(ev.message || "unknown") + "</p>";
        }
      });
    </script>
  </body>
</html>
